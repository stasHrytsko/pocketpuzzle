<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Конверт</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; position: relative; flex-shrink: 0; font-family: Inter, system-ui, sans-serif; color: #33312E;">
  <div style="position: absolute; left: 0; top: 0; width: 290px; height: 200px; transform: scale({{s}}); transform-origin: 0 0; box-sizing: border-box; background: #F1E7D8; border: 1px solid #756B5D; border-radius: 6px; box-shadow: 0 2px 3px rgba(76,57,36,0.12), 0 6px 14px rgba(76,57,36,0.06), inset 0 1px 0 rgba(255,249,239,0.65); overflow: hidden;">
    <svg aria-hidden="true" width="290" height="200" viewBox="0 0 290 200" style="position: absolute; left: -1px; top: -1px;">
      <path d="M1 1 L145 90 L289 1" fill="none" stroke="#756B5D" stroke-opacity="0.55" stroke-width="1"></path>
      <path d="M1 199 L118 112 M289 199 L172 112" fill="none" stroke="#C6B7A5" stroke-width="1"></path>
    </svg>
    <sc-for list="{{slots}}" as="slot" hint-placeholder-count="3">
      <sc-if value="{{slot.show}}" hint-placeholder-val="{{ false }}">
        <button type="button" aria-label="{{slot.label}}" onClick="{{slot.tap}}" disabled="{{slot.inert}}" style="position: absolute; left: {{slot.x}}px; top: 16px; width: 48px; height: 56px; padding: 0; margin: 0; border: {{slot.border}}; border-radius: 4px; background: transparent; cursor: pointer; box-sizing: border-box;">
          <sc-if value="{{slot.filled}}" hint-placeholder-val="{{ false }}">
            <dc-import name="Stamp" game="{{slot.game}}" w="{{slot.sw}}" hint-size="48px,56px"></dc-import>
          </sc-if>
        </button>
      </sc-if>
    </sc-for>
    <sc-if value="{{postmark}}" hint-placeholder-val="{{ false }}">
      <svg aria-hidden="true" width="88" height="40" viewBox="0 0 88 40" style="position: absolute; left: 60px; top: 28px; overflow: visible;">
        <circle cx="20" cy="20" r="16" fill="none" stroke="#6E6459" stroke-opacity="0.65" stroke-width="1.5"></circle>
        <path d="M40 13 c4 -4 8 4 12 0 s8 4 12 0 s8 4 12 0 s8 4 12 0 M40 20 c4 -4 8 4 12 0 s8 4 12 0 s8 4 12 0 s8 4 12 0 M40 27 c4 -4 8 4 12 0 s8 4 12 0 s8 4 12 0 s8 4 12 0" fill="none" stroke="#6E6459" stroke-opacity="0.65" stroke-width="1.5"></path>
        <text x="20" y="23" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" fill="#6E6459">{{date}}</text>
      </svg>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"w":{"editor":"int","default":290,"min":100,"max":870},"slots":{"editor":null},"postmark":{"editor":"boolean","default":true},"date":{"editor":"text","default":"31 X"},"$preview":{"width":290,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    var w = this.props.w ?? 290;
    var s = w / 290;
    var demo = [
      { x: 218, game: 'af', filled: true, show: true, inert: true, sw: 48, border: 'none', label: 'Марка Arrow Flip', tap: null },
      { x: 162, game: 'pf', filled: true, show: true, inert: true, sw: 48, border: 'none', label: 'Марка Perfect Fit', tap: null },
      { x: 106, game: '', filled: false, show: false, inert: true, sw: 48, border: 'none', label: 'Пустое место', tap: null }
    ];
    return {
      w: w, h: Math.round(200 * s), s: s,
      slots: this.props.slots ?? demo,
      postmark: this.props.postmark ?? true,
      date: this.props.date ?? '31 X'
    };
  }
}
</script>
</body>
</html>
