<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Postie — new design</title>
<style>
:root{--milk:#F5EFE5;--card:#FCF7EC;--ink:#536342;--sage:#B1BA96;--blue:#AECAD1;--butter:#F1CA7D;--sand:#D8C6A9}
*{box-sizing:border-box}
body{margin:0;background:var(--milk);color:#2f3a26;font:16px/1.5 system-ui,-apple-system,sans-serif}
main{max-width:960px;margin:0 auto;padding:32px 16px 64px}
h1{font-weight:300;font-size:34px;margin:0 0 4px;letter-spacing:.02em}
p.sub{margin:0 0 28px;color:#6b7560}
h2{font-weight:400;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin:40px 0 12px}
figure{margin:0;background:var(--card);border:1px solid var(--sand);border-radius:16px;overflow:hidden}
img{display:block;width:100%;height:auto}
.sw{display:flex;flex-wrap:wrap;gap:12px}
.sw div{width:84px;text-align:center;font-size:12px;color:#6b7560}
.sw i{display:block;height:56px;border-radius:12px;border:1px solid var(--sand);margin-bottom:6px}
</style></head><body><main>
<h1>Postie</h1>
<p class="sub">Daily puzzles · new design, work in progress. Reference sheets, not a built app yet.</p>
<p><a href="app.html" style="color:#536342;font-size:18px">▶ Open the clickable preview (phone layout)</a></p><h2>Palette</h2>
<div class="sw">
<div><i style="background:#F5EFE5"></i>Milk<br>#F5EFE5</div>
<div><i style="background:#536342"></i>Ink<br>#536342</div>
<div><i style="background:#B1BA96"></i>Sage<br>#B1BA96</div>
<div><i style="background:#AECAD1"></i>Blue<br>#AECAD1</div>
<div><i style="background:#F1CA7D"></i>Butter<br>#F1CA7D</div>
<div><i style="background:#D8C6A9"></i>Sand<br>#D8C6A9</div>
</div>
<h2>Milk / Garden palette</h2><figure><img src="ref/milk-garden-palette.webp" alt="Palette and three sample screens"></figure>
<h2>UI kit</h2><figure><img src="ref/ui-kit-sheet.webp" alt="UI kit sheet"></figure>
<h2>Game screens</h2><figure><img src="ref/game-screens.webp" alt="Arrow Flip, Tight Shelf, The Gap"></figure>
</main></body></html>
